<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador v13.0 - IA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; color: #1f2937; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e5e7eb; }
        .btn { font-weight: 600; transition: all 0.2s; border-radius: 8px; cursor: pointer; }
        .btn:hover { transform: translateY(-1px); filter: brightness(110%); }
        .btn-primary { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; }
        .btn-copy { background-color: #10b981; color: white; }
        .btn-excel { background-color: #16a34a; color: white; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(4px); }
        .modal.open { display: flex; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Badges */
        .badge { padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; display: inline-block; margin-bottom: 2px; }
        .badge-red { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .badge-blue { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .badge-green { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col">

    <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-900 flex items-center gap-3">
                <i class="fa-solid fa-brain text-blue-600"></i> Analisador Pro v13.0
            </h1>
            <p class="text-sm text-gray-500 mt-1">Motor: <strong>Gemini 2.0 Flash</strong> (Alta Precisão)</p>
        </div>
        <div class="flex items-center gap-3">
            <div id="apiStatus" class="hidden px-4 py-2 bg-green-100 text-green-700 rounded-lg text-sm font-bold border border-green-200 flex items-center gap-2">
                <i class="fa-solid fa-link"></i> API Conectada
            </div>
            <button onclick="openConfigModal()" class="btn px-4 py-2 bg-gray-800 text-white hover:bg-gray-700 border border-gray-700">
                <i class="fa-solid fa-key"></i> Configurar Chave
            </button>
        </div>
    </header>

    <div id="configModal" class="modal">
        <div class="bg-white p-8 rounded-xl w-full max-w-md shadow-2xl relative">
            <h2 class="text-2xl font-bold mb-2 text-gray-800">Conectar Inteligência</h2>
            <p class="text-sm text-gray-500 mb-6">Cole sua chave de API do Google AI Studio para ativar o motor Gemini 2.0.</p>
            
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">API Key</label>
            <input type="password" id="apiKeyInput" class="w-full p-3 border border-gray-300 rounded-lg mb-6 font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="AIzaSy...">
            
            <div class="flex justify-end gap-3">
                <button onclick="closeConfigModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium">Cancelar</button>
                <button onclick="saveApiKey()" class="btn btn-primary px-6 py-2 rounded-lg shadow-md">Salvar Chave</button>
            </div>
        </div>
    </div>

    <main class="flex-grow max-w-7xl mx-auto w-full">
        
        <div class="card p-6 mb-8">
            <div class="flex justify-between items-center mb-3">
                <label class="font-bold text-gray-700 flex items-center gap-2">
                    <i class="fa-regular fa-clipboard"></i> Cole a lista bagunçada abaixo:
                </label>
                <button onclick="document.getElementById('inputText').value = ''" class="text-xs text-red-500 hover:text-red-700 font-bold uppercase">Limpar</button>
            </div>
            <textarea id="inputText" class="w-full h-56 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm font-mono mb-4 resize-y" placeholder="Cole o texto aqui... (Ex: Cerveja... Sextou... Levando 12...)"></textarea>
            
            <button id="analyzeBtn" onclick="analyzeWithAI()" class="btn btn-primary w-full py-4 rounded-lg text-lg shadow-lg flex justify-center items-center gap-3">
                <i class="fa-solid fa-microchip"></i> <span>Processar com IA</span>
                <div id="loadingSpinner" class="spinner hidden"></div>
            </button>
        </div>

        <div id="resultsArea" class="space-y-8"></div>

    </main>

    <template id="tableTemplate">
        <div class="card overflow-hidden animate-fade-in border-l-4 border-l-blue-600">
            <div class="bg-gray-50 p-5 border-b border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h3 class="font-extrabold text-xl text-gray-800 list-header flex items-center gap-2">
                        <i class="fa-solid fa-list-ol text-blue-500"></i> <span class="title-text">Lista</span>
                    </h3>
                    <p class="text-xs text-gray-500 mt-1 list-cities font-mono">Processado via Gemini 2.0</p>
                </div>
                <div class="flex gap-2">
                    <button class="btn btn-copy px-4 py-2 rounded text-sm font-bold flex items-center gap-2 btn-copy-action shadow-sm">
                        <i class="fa-regular fa-copy"></i> Copiar
                    </button>
                    <button class="btn btn-excel px-4 py-2 rounded text-sm font-bold flex items-center gap-2 btn-excel-action shadow-sm">
                        <i class="fa-solid fa-file-excel"></i> Excel
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-100 text-gray-600 uppercase text-xs tracking-wider">
                        <tr>
                            <th class="px-6 py-3 w-16 text-center">#</th>
                            <th class="px-6 py-3">Produto / Descrição</th>
                            <th class="px-6 py-3 text-center">Preço</th>
                            <th class="px-6 py-3">Regras / Atacado / Clube</th>
                            <th class="px-6 py-3 w-32 text-center">Código</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 list-body bg-white">
                        </tbody>
                </table>
            </div>
        </div>
    </template>

    <script>
        // --- CONFIGURAÇÃO DA API ---
        let API_KEY = localStorage.getItem('gemini_api_key');
        const MODEL_NAME = 'gemini-2.0-flash'; // O modelo que funcionou na sua conta Pro

        // Verifica se tem chave salva
        if(API_KEY) {
            document.getElementById('apiStatus').classList.remove('hidden');
        } else {
            setTimeout(openConfigModal, 500);
        }

        // --- FUNÇÕES DE MODAL ---
        function openConfigModal() { document.getElementById('configModal').classList.add('open'); }
        function closeConfigModal() { document.getElementById('configModal').classList.remove('open'); }
        
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                API_KEY = key;
                document.getElementById('apiStatus').classList.remove('hidden');
                closeConfigModal();
                alert("API Key salva e pronta para uso!");
            }
        }

        // --- O CÉREBRO (REQUSIÇÃO PARA GEMINI) ---
        async function analyzeWithAI() {
            if(!API_KEY) { alert("Configure a API Key primeiro!"); openConfigModal(); return; }
            
            const text = document.getElementById('inputText').value;
            if(!text.trim()) { alert("Cole o texto da oferta primeiro."); return; }

            const btn = document.getElementById('analyzeBtn');
            const spinner = document.getElementById('loadingSpinner');
            const btnText = btn.querySelector('span');
            const container = document.getElementById('resultsArea');

            // Estado de Carregamento
            btn.disabled = true;
            btnText.textContent = "Processando com IA...";
            spinner.classList.remove('hidden');
            container.innerHTML = '';

            // O PROMPT PERFEITO
            const prompt = `
                Você é um sistema especialista em extração de dados de varejo (OCR Correction).
                Analise o texto desestruturado abaixo. Ele pode conter múltiplas listas de ofertas separadas por cabeçalhos (ex: "Sextou", "Campinas", datas).

                SUA MISSÃO:
                1. Identificar se há divisão de listas (ex: uma geral e uma específica para cidade).
                2. Para cada lista encontrada, extrair os produtos.
                3. Corrigir nomes quebrados (ex: "Cerveja" numa linha e "Brahma" na outra devem virar "Cerveja Brahma").
                4. Identificar regras de atacado ("Levando X pague Y") e preços de clube ("Cliente Campeão").

                Retorne APENAS um JSON válido com esta estrutura:
                [
                    {
                        "titulo_lista": "Nome da Lista ou Cidade (ex: Geral, Campinas)",
                        "itens": [
                            {
                                "descricao": "Nome completo e corrigido do produto",
                                "codigo": "apenas numeros do red.",
                                "preco_normal": "formato X,XX",
                                "preco_clube": "X,XX ou null",
                                "nome_clube": "Nome do clube (ex: Save Ganhe, Nosso Cartão) ou null",
                                "regra_atacado": "Texto completo da regra (ex: A partir de 3 un. pague R$ 10,00) ou null",
                                "preco_atacado": "X,XX ou null (se houver na regra)"
                            }
                        ]
                    }
                ]

                TEXTO PARA ANALISAR:
                ${text}
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                if(data.error) throw new Error(data.error.message);

                // Extração do JSON da resposta
                let aiText = data.candidates[0].content.parts[0].text;
                aiText = aiText.replace(/```json|```/g, '').trim(); // Limpa formatação Markdown
                
                const parsedData = JSON.parse(aiText);
                
                renderData(parsedData);

            } catch (error) {
                console.error(error);
                alert("Erro na IA: " + error.message + "\n\nVerifique se sua conta Pro está ativa ou se a chave está correta.");
            } finally {
                btn.disabled = false;
                btnText.textContent = "Processar com IA";
                spinner.classList.add('hidden');
            }
        }

        // --- RENDERIZAÇÃO NA TELA ---
        function renderData(data) {
            const container = document.getElementById('resultsArea');
            const template = document.getElementById('tableTemplate');

            data.forEach((lista, idx) => {
                const clone = template.content.cloneNode(true);
                
                // Título da Lista
                clone.querySelector('.title-text').textContent = lista.titulo_lista || `Lista ${idx + 1}`;
                clone.querySelector('.list-cities').textContent = `${lista.itens.length} ofertas identificadas`;

                // Botões de Ação
                const copyBtn = clone.querySelector('.btn-copy-action');
                copyBtn.onclick = () => copyToClipboard(lista);
                
                const excelBtn = clone.querySelector('.btn-excel-action');
                excelBtn.onclick = () => exportToExcel(lista, idx);

                const tbody = clone.querySelector('.list-body');

                // Preenche Itens
                lista.itens.forEach((item, i) => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 border-b border-gray-100 last:border-0 transition-colors";

                    // Badges de Regras
                    let badges = "";
                    if(item.preco_clube) {
                        badges += `<div class="badge badge-blue mb-1"><i class="fa-solid fa-id-card"></i> ${item.nome_clube || 'Clube'}: R$ ${item.preco_clube}</div><br>`;
                    }
                    if(item.regra_atacado) {
                        badges += `<div class="badge badge-green"><i class="fa-solid fa-boxes-stacked"></i> ${item.regra_atacado}</div>`;
                    }
                    if(!badges) badges = '<span class="text-gray-300 text-xs">-</span>';

                    // Código
                    const codeDisplay = item.codigo ? `<span class="font-mono text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">${item.codigo}</span>` : '<span class="text-gray-300">-</span>';

                    tr.innerHTML = `
                        <td class="px-6 py-4 text-center text-gray-400 font-mono text-xs">${i + 1}</td>
                        <td class="px-6 py-4 font-medium text-gray-800 text-sm">${item.descricao}</td>
                        <td class="px-6 py-4 text-center font-bold text-lg text-blue-600 whitespace-nowrap">R$ ${item.preco_normal}</td>
                        <td class="px-6 py-4 text-xs leading-relaxed">${badges}</td>
                        <td class="px-6 py-4 text-center">${codeDisplay}</td>
                    `;
                    tbody.appendChild(tr);
                });

                container.appendChild(clone);
            });
        }

        // --- FUNÇÕES DE EXPORTAÇÃO (FORMATO SOLICITADO) ---
        function copyToClipboard(lista) {
            let text = "";
            lista.itens.forEach((item, i) => {
                // Linha 1: Num - Nome - Preço - Código
                text += `${i + 1} - ${item.descricao} – R$ ${item.preco_normal}`;
                if(item.codigo) text += ` (red.${item.codigo})`;
                
                // Adiciona Clube na mesma linha se houver espaço, ou lógica específica
                if(item.preco_clube) {
                    const label = item.nome_clube || "Clube";
                    text += ` (${label}: R$ ${item.preco_clube})`;
                }
                text += "\n";

                // Linha 2: Atacado
                if(item.regra_atacado) {
                    text += `(${item.regra_atacado})\n`;
                }
            });

            navigator.clipboard.writeText(text).then(() => alert("Copiado com sucesso!"));
        }

        function exportToExcel(lista, idx) {
            // Cria array de objetos simples para o Excel
            const excelData = lista.itens.map(item => ({
                Produto: item.descricao,
                Codigo: item.codigo,
                Preco_Normal: item.preco_normal,
                Preco_Clube: item.preco_clube,
                Regra_Atacado: item.regra_atacado
            }));

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Ofertas");
            XLSX.writeFile(wb, `Lista_Ofertas_${idx+1}.xlsx`);
        }

    </script>
</body>
</html>
